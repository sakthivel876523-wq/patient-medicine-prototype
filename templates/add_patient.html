<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>
{% include 'navigation.html' %}

<div class="container">

    <h1>Add New Patient</h1>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <div class="form-grid">

            <div>
                <label>Patient ID</label>
                <input type="text"
                       name="patient_id"
                       placeholder="P001"
                       required>
            </div>

            <div>
                <label>Name</label>
                <input type="text"
                       name="name"
                       required>
            </div>

            <div>
                <label>Age</label>
                <input type="number"
                       name="age"
                       min="0">
            </div>

            <div>
                <label>Gender</label>

                <select name="gender">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

            <div>
                <label>Blood Group</label>

                <select name="blood_group">

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>

            </div>

            <div>
                <label>Contact</label>

                <input type="text"
                       name="contact">
            </div>

            <div>
                <label>Admission Date</label>

                <input type="date"
                       name="admission_date">
            </div>

            <div>
                <label>Ward</label>

                <input type="text"
                       name="ward">
            </div>

            <div>
                <label>Bed</label>

                <input type="text"
                       name="bed">
            </div>

        </div>

        <button type="submit" class="button">
            Save Patient
        </button>

    </form>

    <br>

    <a href="/" class="back-link">
        ← Home
    </a>

</div>

</body>

</html>
